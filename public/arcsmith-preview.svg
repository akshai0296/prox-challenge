<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Arcsmith OmniPro 220 multimodal reasoning interface</title>
  <desc id="description">Dark three-panel technical support interface showing a cited duty-cycle answer and an interactive visual artifact.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20261d"/>
      <stop offset=".38" stop-color="#10120f"/>
      <stop offset="1" stop-color="#0c0e0b"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#background)"/>
  <rect x="0" y="0" width="238" height="675" fill="#141713"/>
  <rect x="800" y="0" width="400" height="675" fill="#131511"/>
  <path d="M238 0v675M800 0v675" stroke="#30352d"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="37" cy="40" r="18" fill="#ff5a2a" opacity=".25" filter="url(#glow)"/>
    <rect x="20" y="22" width="36" height="36" rx="9" fill="#ff5a2a"/>
    <path d="M38 29l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z" fill="#1a150f"/>
    <text x="69" y="39" fill="#f1f1ea" font-size="14" font-weight="700" letter-spacing="2">ARCSMITH</text>
    <text x="69" y="54" fill="#858c81" font-size="9">OmniPro 220 copilot</text>

    <rect x="18" y="83" width="202" height="80" rx="12" fill="#1e211c" stroke="#34392f"/>
    <rect x="29" y="94" width="56" height="56" rx="8" fill="#e8e2d6"/>
    <path d="M39 135h37l-4-25-28-7z" fill="#343a32"/>
    <rect x="48" y="107" width="21" height="12" rx="2" fill="#ff5a2a"/>
    <text x="96" y="105" fill="#737a70" font-size="7" letter-spacing="1">CONNECTED PRODUCT</text>
    <text x="96" y="123" fill="#e4e5de" font-size="10" font-weight="700">Vulcan OmniPro 220</text>
    <text x="96" y="141" fill="#858c81" font-size="8">120 / 240 V · 4 processes</text>

    <text x="26" y="199" fill="#747b70" font-size="8" letter-spacing="1.2">SHOP SHORTCUTS</text>
    <g fill="#b8bdb3" font-size="10">
      <rect x="18" y="210" width="202" height="38" rx="8" fill="#282d25"/>
      <circle cx="36" cy="229" r="8" fill="none" stroke="#ff5a2a"/>
      <path d="M36 229l4-4" stroke="#ff5a2a"/>
      <text x="53" y="233">Duty cycle</text>
      <text x="204" y="233" text-anchor="end" fill="#697066">›</text>
      <text x="53" y="275">TIG setup</text>
      <text x="204" y="275" text-anchor="end" fill="#697066">›</text>
      <text x="53" y="317">Fix porosity</text>
      <text x="204" y="317" text-anchor="end" fill="#697066">›</text>
      <text x="53" y="359">Choose a process</text>
      <text x="204" y="359" text-anchor="end" fill="#697066">›</text>
    </g>
    <g stroke="#71786e" fill="none">
      <path d="M29 270l14-14M30 256l13 14"/>
      <path d="M29 304h15v15H29zM32 307l9 9M41 307l-9 9"/>
      <path d="M29 346h15v15H29zM33 350h7M33 354h7M33 358h5"/>
    </g>

    <path d="M18 600h202" stroke="#30352d"/>
    <circle cx="31" cy="626" r="5" fill="#71cf84"/>
    <text x="44" y="623" fill="#c1c6bb" font-size="9" font-weight="700">51 searchable source pages</text>
    <text x="44" y="639" fill="#747b70" font-size="8">Manual, quick start, visual chart</text>

    <path d="M238 62h562M800 62h400" stroke="#30352d"/>
    <circle cx="265" cy="31" r="4" fill="#71cf84"/>
    <text x="278" y="35" fill="#c8ccc4" font-size="9" letter-spacing=".7">TECHNICAL SUPPORT AGENT</text>
    <text x="770" y="35" fill="#7f867b" font-size="8" text-anchor="end" letter-spacing="1">GROUNDED OFFLINE MODE</text>

    <text x="303" y="108" fill="#747b70" font-size="8" letter-spacing="1.2">YOU</text>
    <rect x="291" y="120" width="454" height="70" rx="12" fill="#242820" stroke="#343a30"/>
    <text x="311" y="150" fill="#e5e6df" font-size="13">What is the MIG duty cycle at 200 A on 240 V?</text>
    <text x="303" y="238" fill="#747b70" font-size="8" letter-spacing="1.2">ARCSMITH</text>
    <text x="303" y="271" fill="#e1e2db" font-size="13">At 200 A on 240 V in MIG mode, the rated duty</text>
    <text x="303" y="294" fill="#e1e2db" font-size="13">cycle is 25%. Weld for 2.5 minutes, then rest</text>
    <text x="303" y="317" fill="#e1e2db" font-size="13">for at least 7.5 minutes in each 10-minute window.</text>

    <rect x="303" y="340" width="150" height="25" rx="13" fill="#20241e" stroke="#3b4238"/>
    <text x="317" y="356" fill="#b8beb2" font-size="8">▣ Rated specifications, p. 7</text>
    <rect x="462" y="340" width="141" height="25" rx="13" fill="#20241e" stroke="#3b4238"/>
    <text x="476" y="356" fill="#b8beb2" font-size="8">▣ Duty-cycle chart, p. 19</text>
    <text x="303" y="397" fill="#b5baaf" font-size="9">› Do you want the verified polarity and cable setup?</text>

    <rect x="291" y="580" width="454" height="53" rx="14" fill="#1c1f1a" stroke="#40463b"/>
    <text x="310" y="611" fill="#777e73" font-size="11">Ask about setup, settings, faults, or weld quality…</text>
    <rect x="693" y="588" width="37" height="37" rx="9" fill="#ff5a2a"/>
    <path d="M704 606h15M714 601l5 5-5 5" fill="none" stroke="#1a150f" stroke-width="2"/>
    <text x="518" y="654" text-anchor="middle" fill="#676e64" font-size="8">Disconnect power before changing connections or servicing the machine.</text>

    <text x="822" y="35" fill="#a2a99e" font-size="8" letter-spacing="1.2">VISUAL GUIDANCE</text>
    <text x="1175" y="35" fill="#676e64" font-size="8" text-anchor="end">2 ARTIFACTS</text>
    <rect x="818" y="82" width="364" height="386" rx="13" fill="#1b1e19" stroke="#343a31"/>
    <circle cx="840" cy="105" r="8" fill="none" stroke="#ff5a2a"/>
    <path d="M840 105l4-4" stroke="#ff5a2a"/>
    <text x="857" y="109" fill="#d7dad2" font-size="9" letter-spacing=".8">MIG · 240 V</text>
    <text x="1158" y="110" fill="#ff5a2a" font-size="18" font-weight="700" text-anchor="end">25%</text>
    <rect x="837" y="134" width="157" height="34" rx="7" fill="#352219" stroke="#ff5a2a"/>
    <text x="916" y="155" fill="#f5f4ed" font-size="10" text-anchor="middle">200 A</text>
    <rect x="1005" y="134" width="157" height="34" rx="7" fill="#20241e" stroke="#3a4037"/>
    <text x="1084" y="155" fill="#a9afa4" font-size="10" text-anchor="middle">115 A</text>

    <circle cx="1000" cy="267" r="74" fill="none" stroke="#343931" stroke-width="14"/>
    <circle cx="1000" cy="267" r="74" fill="none" stroke="#ff5a2a" stroke-width="14" stroke-dasharray="116.24 348.72" stroke-linecap="round" transform="rotate(-90 1000 267)"/>
    <text x="1000" y="265" fill="#f0f0e9" font-size="31" font-weight="700" text-anchor="middle">2.5</text>
    <text x="1000" y="284" fill="#8d9489" font-size="9" text-anchor="middle">MIN WELDING</text>
    <path d="M837 371h325M1000 371v62M837 433h325" stroke="#30352d"/>
    <text x="918" y="392" fill="#7e857a" font-size="8" text-anchor="middle">REST</text>
    <text x="918" y="414" fill="#e1e2db" font-size="13" text-anchor="middle">7.5 min</text>
    <text x="1081" y="392" fill="#7e857a" font-size="8" text-anchor="middle">WINDOW</text>
    <text x="1081" y="414" fill="#e1e2db" font-size="13" text-anchor="middle">10 min</text>
    <text x="838" y="452" fill="#797f75" font-size="8">Only manufacturer-rated points are shown.</text>

    <rect x="818" y="486" width="364" height="139" rx="13" fill="#e7e5dc" stroke="#343a31"/>
    <rect x="831" y="498" width="338" height="88" fill="#f6f3e9"/>
    <text x="845" y="517" fill="#454941" font-size="9" font-weight="700">OWNER'S MANUAL · DUTY CYCLE</text>
    <rect x="845" y="532" width="103" height="38" fill="#ff5a2a"/>
    <rect x="954" y="532" width="92" height="38" fill="#86afb0"/>
    <rect x="1052" y="532" width="103" height="38" fill="#4e5550"/>
    <text x="897" y="555" fill="white" font-size="9" font-weight="700" text-anchor="middle">25% · 200 A</text>
    <text x="1000" y="555" fill="white" font-size="9" font-weight="700" text-anchor="middle">240 V</text>
    <text x="1103" y="555" fill="white" font-size="9" font-weight="700" text-anchor="middle">PAGE 19</text>
    <rect x="818" y="586" width="364" height="39" rx="0 0 13 13" fill="#20241e"/>
    <text x="838" y="610" fill="#b8bdb3" font-size="9">▣ MIG rated duty cycles · Owner's manual, p. 19</text>
  </g>
</svg>
